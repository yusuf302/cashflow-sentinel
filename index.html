<!DOCTYPE html>

<meta charset="UTF-8">
<title>CashFlow Sentinel – Demo</title>
<style>
/* Global */
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f7f9fc;color:#1a1a2e}
.container{max-width:1200px;margin:auto;padding:20px;}

/* Hero */
.hero{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid #e0e0e0}
.hero h1{margin:0;font-size:2rem;color:#1a1a2e}
.hero .subtitle{font-size:0.9rem;color:#555;margin-top:4px}
.hero .badge{background:#1e90ff;color:#fff;font-size:0.8rem;padding:4px 8px;border-radius:12px;vertical-align:middle}

/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:20px}
.card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,0.1);color:#1a1a2e;transition:transform 0.2s;}
.card:hover{transform:translateY(-4px);}
.card .value{font-size:1.6rem;font-weight:bold;color:#2e7d32}
.card .label{font-size:0.9rem;margin-top:4px;color:#555}

/* Summary */
.summary-panel{background:#fff;border-radius:8px;padding:16px;margin-top:20px;box-shadow:0 2px 6px rgba(0,0,0,0.1);color:#1a1a2e}
.summary-panel h2{margin-top:0;color:#2e7d32}
.summary-panel p{margin:4px 0;color:#555}

/* Risks */
.risk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px}
.risk-card{background:#fff;border-radius:8px;padding:12px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,0.1);color:#1a1a2e}
.risk-card .badge{position:absolute;top:12px;right:12px;font-weight:bold;padding:4px 8px;border-radius:12px;}
.risk-card .name{font-size:1rem;color:#1a1a2e;margin-bottom:4px}
.risk-card .evidence{font-size:0.9rem;color:#555;margin:4px 0}
.risk-card .severity{font-size:0.9rem;color:#555;margin:4px 0}
.risk-card .action{font-size:0.9rem;color:#555;margin-top:4px}

/* Badge colors */
.badge-live{background:#1e90ff;color:#fff;}
.badge-P0{background:#ff6b6b;color:#fff;}
.badge-P1{background:#ff9f43;color:#fff;}
.badge-P2{background:#ffd43b;color:#fff;}

/* Chart */
.chart{margin-top:30px;}
.canvas-container{background:#fff;border-radius:8px;padding:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1);margin-top:30px;}
.canvas-container canvas{background:#fff;border-radius:8px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
</head>

// Parse CSV
const parsed = Papa.parse(csvData, {header:true, skipEmptyLines:true}).data;

// Helper functions
function sumBy(filterFunc){return parsed.reduce((s, r)=> filterFunc(r)? s + Number(r.amount) : s, 0);}

const totalIn = sumBy(r=> r.type==='in');
const totalOut = sumBy(r=> r.type==='out');
const netCash = totalIn - totalOut;

// Top customer concentration
const salesByCust = {};
parsed.filter(r=> r.type==='in').forEach(r=>{salesByCust[r.counterparty] = (salesByCust[r.counterparty]||0)+Number(r.amount);});
const sortedCust = Object.entries(salesByCust).sort((a,b)=>b[1]-a[1]);
const top3 = sortedCust.slice(0,3);
const concentrationPerc = top3.reduce((s, [_, amt])=> s+amt, 0)/totalIn*100;

// Expense growth: last 3 months vs previous 3 months
function monthKey(date){return date.substring(0,7);} // YYYY-MM
const monthSums = {};
parsed.forEach(r=>{const mk=monthKey(r.date); monthSums[mk] = (monthSums[mk]||0)+ (r.type==='in'? Number(r.amount): -Number(r.amount));});
const months = Object.keys(monthSums).sort();
const last3 = months.slice(-3).reduce((s,m)=> s+monthSums[m],0);
const prev3 = months.slice(-6,-3).reduce((s,m)=> s+monthSums[m],0);
const expenseGrowth = ((last3 - prev3)/Math.abs(prev3))*100;

// Misc leakage
const miscLeak = sumBy(r=> r.type==='out' && r.category==='misc');

// Risks
const risks = [];
// 1. Revenue concentration
risks.push({name:'Revenue Concentration', evidence:`Top 3 customers account for ${concentrationPerc.toFixed(1)}% of sales.`, severity:concentrationPerc, action:'Diversify customer base or negotiate volume discounts.'});
// 2. Inventory expense growth
risks.push({name:'Inventory Cost Surge', evidence:`Inventory expense grew by ${expenseGrowth.toFixed(1)}% over last 3 months.`, severity:Math.abs(expenseGrowth), action:'Review supplier contracts or explore cheaper alternatives.'});
// 3. Misc leakage
// Compute worst monthly cash deficit
const worstMonthInfo = Object.entries(monthSums).reduce((min, [m, val])=> val < min.val ? {month:m, val} : min, {month:null, val:Infinity});
risks.push({name:'Monthly Cash Deficit', evidence:`Worst monthly cash flow is ${worstMonthInfo.val.toFixed(2)} KES in ${worstMonthInfo.month}.`, severity: Math.abs(worstMonthInfo.val), action:'Review drivers of the deficit and maintain a minimum operating cash buffer.'});

// Rank
risks.sort((a,b)=> b.severity - a.severity);
risks.forEach((r,i)=>{r.rank = i===0?'P0':(i===1?'P1':'P2');});

// Summary text
const summaryText = `The bakery’s cash position is KES ${netCash.toLocaleString()} (inflows KES ${totalIn.toLocaleString()}, outflows KES ${totalOut.toLocaleString()}). ${risks[0].name} is the highest priority (${risks[0].rank}).`;

// Render
document.getElementById('summary').innerHTML = `<h2>Management Summary</h2><p>${summaryText}</p>`;

const metricsDiv = document.getElementById('metrics');
metricsDiv.innerHTML = `<div class='card'><h3>Total Inflows</h3><p>KES ${totalIn.toLocaleString()}</p></div>
<div class='card'><h3>Total Outflows</h3><p>KES ${totalOut.toLocaleString()}</p></div>
<div class='card'><h3>Net Cash Flow</h3><p>KES ${netCash.toLocaleString()}</p></div>
<div class='card'><h3>Revenue Concentration</h3><p>${concentrationPerc.toFixed(1)}% of sales by top 3 customers.</p></div>
<div class='card'><h3>Expense Growth (last 3 months vs prev 3)</h3><p>${expenseGrowth.toFixed(1)}% change.</p></div>`;

const risksDiv = document.getElementById('risks');
risksDiv.innerHTML = '<h2>Top Risks</h2>' + risks.map((r,i)=>`<div class='card'><h3>${r.rank}: ${r.name}</h3><p>${r.evidence}</p><p>Severity: ${r.severity.toFixed(1)}%</p><p>Action: ${r.action}</p></div>`).join('');

// Chart
const labels = months;
const dataPoints = months.map(m=> monthSums[m]);
const ctx = document.getElementById('cashChart').getContext('2d');
new Chart(ctx, {
  type: 'line',
  data: {labels, datasets:[{label:'Cash Flow (KES)',data:dataPoints,fill:false,borderColor:'blue'}]},
  options:{responsive:true,scales:{y:{beginAtZero:true}}}
});
</script>
